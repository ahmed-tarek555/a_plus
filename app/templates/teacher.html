
<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Teacher Dashboard | A+</title>
	<style>
		* { box-sizing: border-box; font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; }
		body { margin: 0; min-height: 100vh; background: linear-gradient(135deg,#f8fbfd,#eef6fc 45%,#dceefa 100%); color:#19324a; }
		nav { padding: 18px 20px; background: rgba(255,255,255,0.9); border-bottom:1px solid rgba(44,117,169,0.06); }
		.nav-container { max-width:1100px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; }
		.nav-brand { font-weight:800; color:#2f8dcc; text-decoration:none; font-size:1.2rem }
		.page { max-width:1100px; margin:28px auto; padding:0 20px 64px; }
		.dashboard { display:grid; grid-template-columns: 1fr 380px; gap:28px; align-items:start; }
		.panel { background: rgba(255,255,255,0.94); border:1px solid rgba(44,117,169,0.12); border-radius:14px; padding:20px; }
		.panel h2 { margin:0 0 12px; font-size:1.15rem; color:#19324a }
		.courses-grid { display:grid; grid-template-columns: repeat(auto-fill,minmax(220px,1fr)); gap:14px; }
		.course-card { padding:14px; border-radius:12px; background:linear-gradient(180deg,#fff,#fbfeff); box-shadow:0 8px 20px rgba(43,95,130,0.06); border:1px solid rgba(44,117,169,0.06); }
		.course-card h3 { margin:0 0 8px; font-size:1rem }
		.course-meta { font-size:0.92rem; color:#5b7488; display:flex; justify-content:space-between; gap:8px; margin-bottom:10px }
		.course-actions { display:flex; gap:8px; justify-content:flex-end }
		.btn { padding:8px 12px; border-radius:10px; border:0; cursor:pointer; font-weight:700 }
		.btn.delete { background:#fff3f4; color:#a93748; border:1px solid rgba(192,57,75,0.12) }
		.btn.view { background:#2f8dcc; color:#fff }
		form.add-course { display:flex; flex-direction:column; gap:10px }
		.field { display:flex; flex-direction:column; gap:6px }
		.field label { font-size:0.88rem; color:#506c82 }
		.field input, .field select { padding:10px 12px; border-radius:8px; border:1px solid rgba(44,117,169,0.08); font-size:0.95rem }
		.submit-row { display:flex; gap:10px; align-items:center }
		.status { margin-top:10px; padding:12px; border-radius:10px; background:rgba(255,255,255,0.9); border:1px solid rgba(44,117,169,0.08); color:#264765; min-height:44px }
		.status.error { border-color: rgba(192,57,75,0.15); background:#fff3f4; color:#a93748 }
		@media (max-width:960px) { .dashboard { grid-template-columns:1fr } }
	</style>
</head>
<body>
	<nav>
		<div class="nav-container">
			<a href="/" class="nav-brand">A+</a>
			<div>
				<a href="/profile" style="text-decoration:none; color:#5b7488; font-weight:600">Profile</a>
			</div>
		</div>
	</nav>

	<main class="page">
		<div class="dashboard">
			<section class="panel">
				<h2>Your courses</h2>
				<div id="coursesGrid" class="courses-grid">
					<!-- course cards inserted here -->
				</div>
				<div id="coursesStatus" class="status">Loading your courses…</div>
			</section>

			<aside class="panel">
				<h2>Add a course</h2>
				<form id="addCourseForm" class="add-course" onsubmit="return false;">
					<div class="field">
						<label for="subject">Subject</label>
						<input id="subject" name="subject" type="text" required />
					</div>
					<div class="field">
						<label for="price">Price (USD)</label>
						<input id="price" name="price" type="number" step="0.01" min="0" required />
					</div>
					<div class="field">
						<label for="stage">Stage</label>
						<select id="stage" name="stage" required>
							<option value="">Select stage</option>
							<option value="الثانوية">الثانوية</option>
							<option value="الاعدادية">الاعدادية</option>
							<option value="الابتدائية">الابتدائية</option>
						</select>
					</div>
					<div class="field">
						<label for="level">Level (numeric)</label>
						<input id="level" name="level" type="number" min="1" required />
					</div>

					<div class="submit-row">
						<button id="addCourseButton" class="btn view" type="button">Add course</button>
					</div>

					<div id="addStatus" class="status">Fill the form and click Add course.</div>
				</form>
			</aside>
		</div>
	</main>

	<script>
		const coursesGrid = document.getElementById('coursesGrid');
		const coursesStatus = document.getElementById('coursesStatus');
		const addCourseForm = document.getElementById('addCourseForm');
		const addCourseButton = document.getElementById('addCourseButton');
		const addStatus = document.getElementById('addStatus');

		function setStatus(el, text, isError = false) {
			el.textContent = text;
			el.classList.toggle('error', isError);
		}

		function renderCourses(courses) {
			coursesGrid.replaceChildren();
			if (!Array.isArray(courses) || !courses.length) {
				coursesGrid.innerHTML = '<div style="grid-column:1/-1; padding:18px; border-radius:12px; background:rgba(255,255,255,0.9); text-align:center; color:#5b7488">No courses yet.</div>';
				setStatus(coursesStatus, 'No courses found.');
				return;
			}

			courses.forEach(course => {
				const card = document.createElement('div');
				card.className = 'course-card';

				const title = document.createElement('h3');
				title.textContent = course.subject || 'Untitled';

				const meta = document.createElement('div');
				meta.className = 'course-meta';
				meta.innerHTML = `<span>Stage: ${course.stage || 'N/A'}</span><span>${course.student_count || 0} students</span>`;

				const actions = document.createElement('div');
				actions.className = 'course-actions';

				const viewBtn = document.createElement('a');
				viewBtn.className = 'btn view';
				viewBtn.href = `/course/${course.id}`;
				viewBtn.textContent = 'View';

				const deleteBtn = document.createElement('button');
				deleteBtn.className = 'btn delete';
				deleteBtn.textContent = 'Delete';
				deleteBtn.addEventListener('click', () => deleteCourse(course.id, card, deleteBtn));

				actions.append(viewBtn, deleteBtn);

				const price = document.createElement('div');
				price.style.marginTop = '10px';
				price.style.fontWeight = '800';
				price.textContent = `$${Number(course.price || 0).toFixed(2)}`;

				card.append(title, meta, price, actions);
				coursesGrid.appendChild(card);
			});

			setStatus(coursesStatus, `${courses.length} course(s)`);
		}

		async function loadCourses() {
			setStatus(coursesStatus, 'Loading your courses…');
			try {
				const res = await fetch('/teacher/courses', { credentials: 'include' });
				if (!res.ok) throw new Error('Unable to load courses');
				const data = await res.json();
				renderCourses(Array.isArray(data) ? data : []);
			} catch (err) {
				setStatus(coursesStatus, err.message || 'Error loading courses', true);
			}
		}

		async function deleteCourse(id, cardEl, buttonEl) {
			if (!confirm('Delete this course? This cannot be undone.')) return;
			buttonEl.disabled = true;
			setStatus(coursesStatus, 'Deleting course…');
			try {
				const res = await fetch(`/teacher/delete_course/${id}`, { method: 'DELETE', credentials: 'include' });
				if (!res.ok) throw new Error('Unable to delete course');
				cardEl.remove();
				setStatus(coursesStatus, 'Course deleted.');
			} catch (err) {
				setStatus(coursesStatus, err.message || 'Delete failed', true);
				buttonEl.disabled = false;
			}
		}

		addCourseButton.addEventListener('click', async () => {
			const subject = document.getElementById('subject').value.trim();
			const price = document.getElementById('price').value;
			const stage = document.getElementById('stage').value;
			const level = Number(document.getElementById('level').value);

			if (!subject || !stage || !price || !level) {
				setStatus(addStatus, 'Please complete all fields.', true);
				return;
			}

			addCourseButton.disabled = true;
			setStatus(addStatus, 'Adding course…');

			try {
				const payload = { subject, price: Number(price), stage, level };
				const res = await fetch('/teacher/add_course', {
					method: 'POST',
					credentials: 'include',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify(payload)
				});
				if (!res.ok) {
					const msg = res.status === 403 ? 'Not authorized to add courses.' : (res.status === 400 ? 'Invalid course data.' : 'Unable to add course.');
					throw new Error(msg);
				}
				const data = await res.json();
				if (data && data.success) {
					setStatus(addStatus, 'Course added. Refreshing list…');
					// reset form
					addCourseForm.reset();
					await loadCourses();
					setStatus(addStatus, 'Course added successfully.');
				} else {
					throw new Error('Add course failed.');
				}
			} catch (err) {
				setStatus(addStatus, err.message || 'Add failed', true);
			} finally {
				addCourseButton.disabled = false;
			}
		});

		// initial load
		loadCourses();
	</script>
</body>
</html>
