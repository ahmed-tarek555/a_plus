<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Teacher Dashboard | A+</title>
	<style>
		* {
			box-sizing: border-box;
			font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
		}

		body {
			margin: 0;
			min-height: 100vh;
			background: linear-gradient(135deg, #f8fbfd, #eef6fc 45%, #dceefa 100%);
			color: #19324a;
		}

		nav {
			padding: 18px 20px;
			background: rgba(255, 255, 255, 0.9);
			border-bottom: 1px solid rgba(44, 117, 169, 0.06);
		}

		.nav-container {
			max-width: 1100px;
			margin: 0 auto;
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 16px;
		}

		.nav-brand {
			font-weight: 800;
			color: #2f8dcc;
			text-decoration: none;
			font-size: 1.2rem
		}

		.nav-btn {
			padding: 9px 18px;
			border: none;
			border-radius: 6px;
			font-size: 0.9rem;
			font-weight: 700;
			cursor: pointer;
			text-decoration: none;
			display: inline-flex;
			align-items: center;
			transition: all 0.2s;
			white-space: nowrap;
		}

		.nav-btn-secondary {
			color: #2563eb;
			background: transparent;
		}

		.nav-btn-secondary:hover {
			background: #eef2ff;
		}

		.nav-btn-profile {
			background: #eff6ff;
			color: #2563eb;
		}

		.nav-btn-profile:hover {
			background: #dbeafe;
		}

		.page {
			max-width: 1100px;
			margin: 28px auto;
			padding: 0 20px 64px;
		}

		.dashboard {
			display: grid;
			grid-template-columns: 1fr 380px;
			gap: 28px;
			align-items: start;
		}

		.panel {
			background: rgba(255, 255, 255, 0.94);
			border: 1px solid rgba(44, 117, 169, 0.12);
			border-radius: 14px;
			padding: 20px;
		}

		.panel h2 {
			margin: 0 0 12px;
			font-size: 1.15rem;
			color: #19324a
		}

		.courses-grid {
			display: grid;
			grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
			gap: 14px;
		}

		.course-card {
			padding: 14px;
			border-radius: 12px;
			background: linear-gradient(180deg, #fff, #fbfeff);
			box-shadow: 0 8px 20px rgba(43, 95, 130, 0.06);
			border: 1px solid rgba(44, 117, 169, 0.06);
		}

		.course-card h3 {
			margin: 0 0 8px;
			font-size: 1rem
		}

		.course-meta {
			font-size: 0.92rem;
			color: #5b7488;
			display: flex;
			justify-content: space-between;
			gap: 8px;
			margin-bottom: 10px
		}

		.course-actions {
			display: flex;
			gap: 8px;
			justify-content: flex-end
		}

		.btn {
			padding: 8px 12px;
			border-radius: 10px;
			border: 0;
			cursor: pointer;
			font-weight: 700
		}

		.btn.delete {
			background: #fff3f4;
			color: #a93748;
			border: 1px solid rgba(192, 57, 75, 0.12)
		}

		.btn.view {
			background: #2f8dcc;
			color: #fff
		}

		form.add-course {
			display: flex;
			flex-direction: column;
			gap: 10px
		}

		.field {
			display: flex;
			flex-direction: column;
			gap: 6px
		}

		.field label {
			font-size: 0.88rem;
			color: #506c82
		}

		.field input,
		.field select {
			padding: 10px 12px;
			border-radius: 8px;
			border: 1px solid rgba(44, 117, 169, 0.08);
			font-size: 0.95rem
		}

		.submit-row {
			display: flex;
			gap: 10px;
			align-items: center
		}

		.package-panel {
			margin-top: 16px;
			padding: 14px;
			border-radius: 12px;
			background: #f8fbff;
			border: 1px solid rgba(44, 117, 169, 0.1)
		}

		.package-options {
			display: grid;
			grid-template-columns: 1fr;
			gap: 10px;
			margin: 12px 0 14px
		}

		.package-option {
			display: flex;
			align-items: center;
			gap: 10px;
			padding: 10px 12px;
			border-radius: 10px;
			background: #fff;
			border: 1px solid rgba(44, 117, 169, 0.08)
		}

		.package-option input {
			margin: 0
		}

		.package-check {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			gap: 6px;
			padding: 6px 10px;
			border-radius: 999px;
			background: #eff6ff;
			color: #2563eb;
			font-size: 0.78rem;
			font-weight: 800;
			border: 1px solid rgba(37, 99, 235, 0.18)
		}

		.package-check input {
			margin: 0;
			accent-color: #2563eb
		}

		.course-card-top {
			display: flex;
			justify-content: space-between;
			align-items: flex-start;
			gap: 10px
		}

		.status {
			margin-top: 10px;
			padding: 12px;
			border-radius: 10px;
			background: rgba(255, 255, 255, 0.9);
			border: 1px solid rgba(44, 117, 169, 0.08);
			color: #264765;
			min-height: 44px
		}

		.status.error {
			border-color: rgba(192, 57, 75, 0.15);
			background: #fff3f4;
			color: #a93748
		}

		@media (max-width:960px) {
			.dashboard {
				grid-template-columns: 1fr
			}
		}
	</style>
</head>

<body>
	<nav>
		<div class="nav-container">
			<a href="/" class="nav-brand">A+</a>
			<div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap;">
				<a href="/profile" class="nav-btn nav-btn-profile">Profile</a>
				<a href="/logout" class="nav-btn nav-btn-secondary">Log out</a>
			</div>
		</div>
	</nav>

	<main class="page">
		<div class="dashboard">
			<section class="panel">
				<h2>Your courses</h2>
				<div id="coursesGrid" class="courses-grid">
					<!-- course cards inserted here -->
				</div>
				<div id="coursesStatus" class="status">Loading your courses…</div>
			</section>

			<aside class="panel">
				<h2>Add a course</h2>
				<form id="addCourseForm" class="add-course" onsubmit="return false;">
					<div class="field">
						<label for="subject">Subject</label>
						<input id="subject" name="subject" type="text" required />
					</div>
					<div class="field">
						<label for="price">Price (EGP)</label>
						<input id="price" name="price" type="number" step="0.01" min="0" required />
					</div>
					<div class="field">
						<label for="stage">Stage</label>
						<select id="stage" name="stage" required>
							<option value="">Select stage</option>
							<option value="الثانوية">الثانوية</option>
							<option value="الاعدادية">الاعدادية</option>
							<option value="الابتدائية">الابتدائية</option>
						</select>
					</div>
					<div class="field">
						<label for="level">Level (numeric)</label>
						<input id="level" name="level" type="number" min="1" required />
					</div>

					<div class="submit-row">
						<button id="addCourseButton" class="btn view" type="button">Add course</button>
					</div>

					<div id="addStatus" class="status">Fill the form and click Add course.</div>
				</form>

			<div class="submit-row" style="margin-top:18px;">
				<button id="createPackageButton" class="btn view" type="button">Create a package</button>
			</div>

			<div id="packagePanel" class="package-panel" hidden>
				<h2 style="margin-bottom:10px;">Package details</h2>
				<div class="field">
					<label for="packageTitle">Title</label>
					<input id="packageTitle" type="text" placeholder="Enter package title" />
				</div>
				<div class="field" style="margin-top:10px;">
					<label for="packagePrice">Price (EGP)</label>
					<input id="packagePrice" type="number" step="0.01" min="0" placeholder="Enter package price" />
				</div>
				<div class="field" style="margin-top:14px;">
					<label>Selected courses</label>
					<div id="selectedCourses" class="status" style="margin-top:8px; min-height: auto;">No courses selected yet.</div>
				</div>
				<div class="submit-row" style="margin-top:14px;">
					<button id="savePackageButton" class="btn view" type="button">Save</button>
					<button id="cancelPackageButton" class="btn delete" type="button">Cancel</button>
				</div>
				<div id="packageStatus" class="status">Choose a title, price, and at least one course.</div>
			</div>
		</aside>
	</div>
</main>

<script>
	const coursesGrid = document.getElementById('coursesGrid');
	const coursesStatus = document.getElementById('coursesStatus');
	const addCourseForm = document.getElementById('addCourseForm');
	const addCourseButton = document.getElementById('addCourseButton');
	const addStatus = document.getElementById('addStatus');
	const createPackageButton = document.getElementById('createPackageButton');
	const packagePanel = document.getElementById('packagePanel');
	const packageTitle = document.getElementById('packageTitle');
	const packagePrice = document.getElementById('packagePrice');
	const packageCourseChoices = document.getElementById('packageCourseChoices');
	const savePackageButton = document.getElementById('savePackageButton');
	const cancelPackageButton = document.getElementById('cancelPackageButton');
	const packageStatus = document.getElementById('packageStatus');
	let currentCourses = [];
	let isPackageMode = false;
	let selectedPackageCourseIds = new Set();

	function setStatus(el, text, isError = false) {
		el.textContent = text;
		el.classList.toggle('error', isError);
	}

	function renderCourses(courses) {
		currentCourses = Array.isArray(courses) ? courses : [];
		coursesGrid.replaceChildren();
		if (!currentCourses.length) {
			coursesGrid.innerHTML = '<div style="grid-column:1/-1; padding:18px; border-radius:12px; background:rgba(255,255,255,0.9); text-align:center; color:#5b7488">No courses yet.</div>';
			setStatus(coursesStatus, 'No courses found.');
			return;
		}

		currentCourses.forEach(course => {
			const card = document.createElement('div');
			card.className = 'course-card';

			const topRow = document.createElement('div');
			topRow.className = 'course-card-top';

			const title = document.createElement('h3');
			title.textContent = course.subject || 'Untitled';
			topRow.appendChild(title);

			const meta = document.createElement('div');
			meta.className = 'course-meta';
			meta.innerHTML = `<span>Stage: ${course.stage || 'N/A'}</span><span>${course.student_count || 0} students</span>`;

			const actions = document.createElement('div');
			actions.className = 'course-actions';

			const viewBtn = document.createElement('a');
			viewBtn.className = 'btn view';
			viewBtn.href = `/manage_course/${course.id}`;
			viewBtn.textContent = 'Manage';

			const deleteBtn = document.createElement('button');
			deleteBtn.className = 'btn delete';
			deleteBtn.textContent = 'Delete';
			deleteBtn.addEventListener('click', () => deleteCourse(course.id, card, deleteBtn));

			actions.append(viewBtn, deleteBtn);

			const price = document.createElement('div');
			price.style.marginTop = '10px';
			price.style.fontWeight = '800';
			price.textContent = `EGP${Number(course.price || 0).toFixed(2)}`;

			if (isPackageMode) {
				const selectWrap = document.createElement('label');
				selectWrap.className = 'package-check';

				const checkbox = document.createElement('input');
				checkbox.type = 'checkbox';
				checkbox.className = 'course-package-checkbox';
				checkbox.checked = selectedPackageCourseIds.has(course.id);
				checkbox.addEventListener('change', (event) => {
					if (event.target.checked) {
						selectedPackageCourseIds.add(course.id);
					} else {
						selectedPackageCourseIds.delete(course.id);
					}
					updateSelectedCoursesList();
				});

				const labelText = document.createElement('span');
				labelText.textContent = 'Select';

				selectWrap.append(checkbox, labelText);
				topRow.appendChild(selectWrap);
			}

			card.append(topRow, meta, price);
			card.append(actions);
			coursesGrid.appendChild(card);
		});

		setStatus(coursesStatus, `${currentCourses.length} course(s)`);
	}

	function updateSelectedCoursesList() {
		const selectedTitles = currentCourses
			.filter(course => selectedPackageCourseIds.has(course.id))
			.map(course => course.subject || 'Untitled');

		const selectedCoursesEl = document.getElementById('selectedCourses');
		if (selectedCoursesEl) {
			selectedCoursesEl.textContent = selectedTitles.length
				? selectedTitles.join(', ')
				: 'No courses selected yet.';
		}
	}

	function openPackagePanel() {
		isPackageMode = true;
		selectedPackageCourseIds.clear();
		renderCourses(currentCourses);
		packagePanel.hidden = false;
		packageTitle.focus();
		updateSelectedCoursesList();
		setStatus(packageStatus, 'Choose a title, price, and at least one course.');
	}

	function closePackagePanel() {
		isPackageMode = false;
		selectedPackageCourseIds.clear();
		packagePanel.hidden = true;
		packageTitle.value = '';
		packagePrice.value = '';
		renderCourses(currentCourses);
		updateSelectedCoursesList();
	}

		async function loadCourses() {
			setStatus(coursesStatus, 'Loading your courses…');
			try {
				const res = await fetch('/teacher/courses', { credentials: 'include' });
				if (!res.ok) throw new Error('Unable to load courses');
				const data = await res.json();
				renderCourses(Array.isArray(data) ? data : []);
			} catch (err) {
				setStatus(coursesStatus, err.message || 'Error loading courses', true);
			}
		}

		async function deleteCourse(id, cardEl, buttonEl) {
			if (!confirm('Delete this course? This cannot be undone.')) return;
			buttonEl.disabled = true;
			setStatus(coursesStatus, 'Deleting course…');
			try {
				const res = await fetch(`/teacher/delete_course/${id}`, { method: 'DELETE', credentials: 'include' });
				if (!res.ok) throw new Error('Unable to delete course');
				cardEl.remove();
				setStatus(coursesStatus, 'Course deleted.');
			} catch (err) {
				setStatus(coursesStatus, err.message || 'Delete failed', true);
				buttonEl.disabled = false;
			}
		}

		addCourseButton.addEventListener('click', async () => {
			const subject = document.getElementById('subject').value.trim();
			const price = document.getElementById('price').value;
			const stage = document.getElementById('stage').value;
			const level = Number(document.getElementById('level').value);

			if (!subject || !stage || !price || !level) {
				setStatus(addStatus, 'Please complete all fields.', true);
				return;
			}

			addCourseButton.disabled = true;
			setStatus(addStatus, 'Adding course…');

			try {
				const payload = { subject, price: Number(price), stage, level };
				const res = await fetch('/teacher/add_course', {
					method: 'POST',
					credentials: 'include',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify(payload)
				});
				if (!res.ok) {
					const msg = res.status === 403 ? 'Not authorized to add courses.' : (res.status === 400 ? 'Invalid course data.' : 'Unable to add course.');
					throw new Error(msg);
				}
				const data = await res.json();
				if (data && data.success) {
					setStatus(addStatus, 'Course added. Refreshing list…');
					addCourseForm.reset();
					await loadCourses();
					setStatus(addStatus, 'Course added successfully.');
				} else {
					throw new Error('Add course failed.');
				}
			} catch (err) {
				setStatus(addStatus, err.message || 'Add failed', true);
			} finally {
				addCourseButton.disabled = false;
			}
		});

		createPackageButton.addEventListener('click', openPackagePanel);
		cancelPackageButton.addEventListener('click', closePackagePanel);

		savePackageButton.addEventListener('click', async () => {
			const title = packageTitle.value.trim();
			const price = Number(packagePrice.value);
			const selected = Array.from(document.querySelectorAll('.course-package-checkbox:checked')).map((checkbox) => ({
				course_id: Number(checkbox.closest('.course-card')?.querySelector('a.btn.view')?.href?.split('/').pop() || 0)
			}));

			if (!title || !price || !selected.length) {
				setStatus(packageStatus, 'Please enter a title, price, and select at least one course.', true);
				return;
			}

			savePackageButton.disabled = true;
			setStatus(packageStatus, 'Saving package…');

			try {
				const payload = {
					title,
					price,
					courses_ids: selected
				};

				const res = await fetch('/teacher/create_package', {
					method: 'POST',
					credentials: 'include',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify(payload)
				});

				if (!res.ok) {
					const msg = res.status === 403 ? 'Not authorized to create packages.' : 'Unable to create package.';
					throw new Error(msg);
				}

				const data = await res.json();
				if (data && data.success) {
					setStatus(packageStatus, 'Package created successfully.');
					closePackagePanel();
				} else {
					throw new Error('Package creation failed.');
				}
			} catch (err) {
				setStatus(packageStatus, err.message || 'Unable to create package.', true);
			} finally {
				savePackageButton.disabled = false;
			}
		});

		loadCourses();
	</script>
</body>

</html>
