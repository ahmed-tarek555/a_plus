<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Private Lectures</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #10213f;
      --ink-soft: #56698c;
      --paper: #f7f9ff;
      --paper-alt: #eef3fc;
      --blue: #2563eb;
      --blue-deep: #14306b;
      --blue-mid: #1d4ed8;
      --line: #c9d9f5;
      --border: #dbe7ff;
      --font-display: "Fraunces", serif;
      --font-body: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: "IBM Plex Mono", monospace;
    }

    * { box-sizing: border-box; font-family: var(--font-body); }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
    }

    nav {
      padding: 18px 20px;
      background: rgba(255, 255, 255, 0.9);
      border-bottom: 1px solid rgba(44, 117, 169, 0.06);
    }

    .nav-container {
      max-width: 1280px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .nav-brand {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 2px solid var(--blue);
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1rem;
      color: var(--blue);
      text-decoration: none;
      transform: rotate(-4deg);
    }

    .nav-btn {
      padding: 9px 18px;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      transition: all 0.2s;
      white-space: nowrap;
      font-family: var(--font-body);
    }

    .nav-btn-secondary {
      color: var(--blue);
      background: transparent;
    }

    .nav-btn-secondary:hover {
      background: var(--paper-alt);
    }

    .nav-btn-profile {
      background: var(--blue);
      color: #fff;
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.2);
    }

    .nav-btn-profile:hover {
      background: var(--blue-mid);
    }

    .page {
      max-width: 1280px;
      margin: 28px auto;
      padding: 0 20px 64px;
    }

    .panel {
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 16px 40px rgba(20, 48, 107, 0.08);
    }

    .panel h2 {
      margin: 0 0 12px;
      font-family: var(--font-display);
      font-size: 2rem;
      line-height: 1.1;
      letter-spacing: -0.01em;
      color: var(--blue-deep);
      font-weight: 600;
    }

    .lectures-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 18px;
    }

    .lecture-card {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      min-height: 220px;
      padding: 16px;
      border-radius: 16px;
      background: linear-gradient(190deg, rgba(16, 33, 63, 0.15) 10%, rgba(16, 33, 63, 0.88) 100%);
      box-shadow: 0 18px 36px rgba(20, 48, 107, 0.12);
      border: 1px solid var(--border);
      overflow: hidden;
      isolation: isolate;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    .lecture-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(11, 20, 31, 0.12) 0%, rgba(11, 20, 31, 0.7) 100%);
      z-index: 0;
    }

    .lecture-card::after {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 4px;
      background: linear-gradient(90deg, #2563eb, #60a5fa);
      z-index: 2;
    }

    .lecture-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 44px rgba(20, 48, 107, 0.22);
    }

    .lecture-card > * {
      position: relative;
      z-index: 1;
    }

    .lecture-card h3 {
      margin: 0 0 8px;
      font-size: 1.15rem;
      font-family: var(--font-display);
      font-weight: 600;
      color: #ffffff;
      line-height: 1.35;
    }

    .teacher-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      border-top: 1px solid rgba(255,255,255,0.2);
      padding-top: 10px;
    }

    .teacher-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(255,255,255,0.22);
      background: rgba(255,255,255,0.12);
      flex-shrink: 0;
    }

    .teacher-name {
      color: #ffffff;
      font-size: 0.85rem;
      font-weight: 700;
      line-height: 1.35;
    }

    .teacher-phone {
      font-size: 0.75rem;
      color: rgba(255,255,255,0.8);
    }

    .meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      color: rgba(255,255,255,0.9);
      font-family: var(--font-mono);
      font-size: 0.72rem;
      border-top: 1px solid rgba(255,255,255,0.18);
      padding-top: 10px;
    }

    .meta span {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.18);
      color: #eaf1ff;
    }

    .link-box {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.18);
      word-break: break-all;
      font-size: 0.9rem;
      color: #ffffff;
    }

    .link-box a {
      color: #ffffff;
      font-weight: 700;
      text-decoration: none;
    }

    .status {
      margin-top: 10px;
      padding: 12px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(44, 117, 169, 0.08);
      color: #264765;
      min-height: 44px;
      font-size: 0.92rem;
    }

    .status.error {
      border-color: rgba(192, 57, 75, 0.15);
      background: #fff3f4;
      color: #a93748;
    }
  </style>
</head>

<body>
  <nav>
    <div class="nav-container">
      <a href="/" class="nav-brand">A+</a>
      <div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap;">
        <a href="/profile" class="nav-btn nav-btn-profile">Profile</a>
        <a href="/logout" class="nav-btn nav-btn-secondary">Log out</a>
      </div>
    </div>
  </nav>

  <main class="page">
    <section class="panel">
      <h2>My private lectures</h2>
      <div id="lecturesGrid" class="lectures-grid"></div>
      <div id="lecturesStatus" class="status">Loading your private lectures…</div>
    </section>
  </main>

  <script>
    const lecturesGrid = document.getElementById('lecturesGrid');
    const lecturesStatus = document.getElementById('lecturesStatus');

    function setStatus(el, text, isError = false) {
      el.textContent = text;
      el.classList.toggle('error', isError);
    }

    function renderLectures(lectures) {
      const items = Array.isArray(lectures) ? lectures : [];
      lecturesGrid.replaceChildren();

      if (!items.length) {
        lecturesGrid.innerHTML = '<div style="grid-column:1/-1; padding:18px; border-radius:12px; background:rgba(255,255,255,0.9); text-align:center; color:#5b7488">No private lectures booked yet.</div>';
        setStatus(lecturesStatus, 'No private lectures found.');
        return;
      }

      items.forEach((lecture) => {
        const card = document.createElement('div');
        card.className = 'lecture-card';

        const title = document.createElement('h3');
        title.textContent = lecture.title || 'Untitled';

        const teacherRow = document.createElement('div');
        teacherRow.className = 'teacher-row';

        const avatar = document.createElement('img');
        avatar.className = 'teacher-avatar';
        const teacherName = [lecture.teacher_first_name, lecture.teacher_last_name].filter(Boolean).join(' ') || 'Teacher';
        avatar.src = lecture.teacher_pfp_url || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(teacherName) + '&background=DBEAFE&color=2563EB';
        avatar.alt = teacherName;

        const teacherText = document.createElement('div');
        teacherText.className = 'teacher-text';
        teacherText.innerHTML = `
          <div class="teacher-name">${teacherName}</div>
        `;

        teacherRow.append(avatar, teacherText);

        const meta = document.createElement('div');
        meta.className = 'meta';
        meta.innerHTML = `<span>${lecture.subject || 'N/A'}</span><span>${lecture.start_date ? new Date(lecture.start_date).toLocaleString() : 'N/A'}</span>`;

        const linkBox = document.createElement('div');
        linkBox.className = 'link-box';
        if (lecture.link) {
          linkBox.innerHTML = `<a href="${lecture.link}" target="_blank" rel="noopener noreferrer">Open meeting link</a>`;
        } else {
          linkBox.textContent = 'No meeting link yet.';
        }

        card.append(title, teacherRow, meta, linkBox);
        lecturesGrid.appendChild(card);
      });

      setStatus(lecturesStatus, `${items.length} private lecture(s)`);
    }

    async function loadPrivateLectures() {
      setStatus(lecturesStatus, 'Loading your private lectures…');
      try {
        const res = await fetch('/student/get_private_lectures', { credentials: 'include' });
        if (!res.ok) throw new Error('Unable to load private lectures');
        const data = await res.json();
        renderLectures(Array.isArray(data) ? data : []);
      } catch (err) {
        setStatus(lecturesStatus, err.message || 'Error loading private lectures', true);
      }
    }

    loadPrivateLectures();
  </script>
</body>

</html>
