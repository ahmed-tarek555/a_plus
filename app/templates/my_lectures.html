<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My Lectures | A+</title>
    <style>
        * { box-sizing: border-box; font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; }
        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #f8fbfd, #eef6fc 45%, #dceefa 100%);
            color: #19324a;
        }
        .page {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px 48px;
        }
        .card {
            background: rgba(255,255,255,0.96);
            border: 1px solid rgba(44,117,169,0.12);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 16px 40px rgba(43,95,130,0.08);
        }
        h1 { margin: 0 0 12px; font-size: 1.8rem; }
        p { margin: 0 0 18px; color: #4f6e86; }
        .lecture-list { display: grid; gap: 12px; }
        .lecture-item {
            display: block;
            padding: 16px 18px;
            border-radius: 12px;
            background: #f7fbff;
            border: 1px solid rgba(44,117,169,0.1);
            color: #1f3d57;
            text-decoration: none;
        }

        .lecture-item-title {
            margin: 0 0 6px;
            font-size: 1rem;
            font-weight: 700;
        }

        .lecture-item-subject {
            margin: 0;
            color: #4f6e86;
            font-size: 0.94rem;
            font-weight: 500;
        }

        .lecture-item:hover { background: #eef6ff; }
        .empty {
            padding: 16px;
            border-radius: 12px;
            background: #f6f8fb;
            color: #5b7488;
        }
    </style>
</head>
<body>
    <main class="page">
        <section class="card">
            <h1>My lectures</h1>
            {% if lectures %}
                <div class="lecture-list">
                    {% for lecture in lectures %}
                        <a class="lecture-item" href="/lecture/{{ lecture.id }}" data-lecture-id="{{ lecture.id }}">
                            <p class="lecture-item-title">{{ lecture.title }}</p>
                            <p class="lecture-item-subject">{{ lecture.subject or 'No subject' }}</p>
                        </a>
                    {% endfor %}
                </div>
            {% else %}
                <div class="empty">You have not bought any lectures yet.</div>
            {% endif %}
        </section>
    </main>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            document.querySelectorAll(".lecture-item").forEach(function (item) {
                item.addEventListener("click", function (event) {
                    event.preventDefault();
                    const lectureId = this.dataset.lectureId;
                    const lectureUrl = this.href;

                    fetch(`/student/attend/${lectureId}`, {
                        method: "POST",
                        credentials: "include",
                    })
                        .then(function (response) {
                            if (!response.ok) {
                                return response.json().then(function (data) {
                                    throw new Error(data.detail || "Unable to mark attendance.");
                                });
                            }
                            return response.json();
                        })
                        .then(function (data) {
                            if (data.success) {
                                window.location = lectureUrl;
                            } else {
                                throw new Error("Unable to mark attendance.");
                            }
                        })
                        .catch(function (error) {
                            alert(error.message);
                        });
                });
            });
        });
    </script>
</body>
</html>
