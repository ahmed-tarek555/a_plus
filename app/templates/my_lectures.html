<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My Lectures | A+</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #10213f;
            --ink-soft: #56698c;
            --paper: #f7f9ff;
            --paper-alt: #eef3fc;
            --blue: #2563eb;
            --blue-deep: #14306b;
            --blue-mid: #1d4ed8;
            --line: #c9d9f5;
            --border: #dbe7ff;
            --font-display: "Fraunces", serif;
            --font-body: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
            --font-mono: "IBM Plex Mono", monospace;
        }

        * {
            box-sizing: border-box;
            font-family: var(--font-body);
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--paper);
            color: var(--ink);
        }

        .page {
            max-width: 1280px;
            margin: 40px auto;
            padding: 0 20px 48px;
        }

        .card {
            background: rgba(255,255,255,0.96);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 16px 40px rgba(20, 48, 107, 0.08);
        }

        h1 {
            margin: 0 0 12px;
            font-family: var(--font-display);
            font-size: 2.1rem;
            line-height: 1.1;
            letter-spacing: -0.01em;
            color: var(--blue-deep);
            font-weight: 600;
        }

        p {
            margin: 0 0 18px;
            color: var(--ink-soft);
        }

        .lecture-list {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 18px;
        }

        .lecture-item {
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            width: 100%;
            min-height: 200px;
            border-radius: 16px;
            color: #ffffff;
            text-decoration: none;
            overflow: hidden;
            background-size: cover;
            background-position: center;
            border: 1px solid var(--border);
            box-shadow: 0 18px 36px rgba(20, 48, 107, 0.12);
            transition: transform 0.18s ease, box-shadow 0.18s ease;
            background-color: var(--blue-deep);
            isolation: isolate;
            padding: 16px;
        }

        .lecture-item::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(190deg, rgba(16, 33, 63, 0.15) 10%, rgba(16, 33, 63, 0.88) 100%);
            z-index: 0;
        }

        .lecture-item::after {
            content: "";
            position: absolute;
            inset: 0 0 auto 0;
            height: 4px;
            background: linear-gradient(90deg, #2563eb, #60a5fa);
            z-index: 2;
        }

        .lecture-item:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 44px rgba(20, 48, 107, 0.22);
        }

        .lecture-avatar {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255,255,255,0.22);
            background: rgba(255,255,255,0.12);
            flex: 0 0 52px;
            position: relative;
            z-index: 1;
        }

        .lecture-content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
            width: 100%;
            max-width: 100%;
            min-width: 0;
        }

        .lecture-item-title {
            margin: 0;
            font-size: 1.05rem;
            font-weight: 800;
            color: #ffffff;
            line-height: 1.3;
            white-space: normal;
            overflow-wrap: anywhere;
            font-family: var(--font-display);
        }

        .lecture-teacher {
            margin: 0;
            color: #e0f2fe;
            font-weight: 700;
            font-size: 0.8rem;
            white-space: normal;
            overflow-wrap: anywhere;
            line-height: 1.3;
            font-family: var(--font-body);
        }

        .lecture-item-subject {
            margin: 0;
            color: rgba(255,255,255,0.8);
            font-size: 0.82rem;
            font-weight: 600;
            white-space: normal;
            overflow-wrap: anywhere;
        }

        .lecture-item-header {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            width: 100%;
            margin-bottom: 10px;
        }

        .lecture-tag {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 4px 10px;
            border-radius: 999px;
            background: rgba(255,255,255,0.14);
            border: 1px solid rgba(255,255,255,0.28);
            color: #eaf1ff;
            font-family: var(--font-mono);
            font-size: 0.68rem;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .lecture-teacher-row {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid rgba(255,255,255,0.18);
        }

        @media (max-width: 1200px) {
            .lecture-list {
                grid-template-columns: repeat(4, minmax(0, 1fr));
            }
        }

        @media (max-width: 960px) {
            .lecture-list {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }
        }

        @media (max-width: 700px) {
            .lecture-list {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 480px) {
            .lecture-list {
                grid-template-columns: 1fr;
            }
        }

        .empty {
            padding: 16px;
            border-radius: 12px;
            background: var(--paper-alt);
            color: var(--ink-soft);
            border: 1px dashed var(--border);
        }
    </style>
</head>
<body>
    <main class="page">
        <section class="card">
            <h1>My lectures</h1>
            {% if lectures %}
                <div class="lecture-list">
                    {% for lecture in lectures %}
                        <a class="lecture-item" href="/lecture/{{ lecture.id }}" data-lecture-id="{{ lecture.id }}" style="background-image: url('{{ lecture.cover_url }}')">
                            <div class="lecture-item-header">
                                <span class="lecture-tag">{{ lecture.subject or 'No subject' }}</span>
                            </div>
                            <div class="lecture-content">
                                <p class="lecture-item-title">{{ lecture.title }}</p>
                            </div>
                            <div class="lecture-teacher-row">
                                <img class="lecture-avatar" src="{{ lecture.pfp or ('https://ui-avatars.com/api/?name=' ~ (lecture.first_name or '') ~ '+' ~ (lecture.last_name or '') ~ '&background=DBEAFE&color=2563EB') }}" alt="{{ lecture.first_name }} {{ lecture.last_name }}">
                                <p class="lecture-teacher">{{ lecture.first_name }} {{ lecture.last_name }}</p>
                            </div>
                        </a>
                    {% endfor %}
                </div>
            {% else %}
                <div class="empty">You have not bought any lectures yet.</div>
            {% endif %}
        </section>
    </main>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            document.querySelectorAll(".lecture-item").forEach(function (item) {
                item.addEventListener("click", function (event) {
                    event.preventDefault();
                    const lectureId = this.dataset.lectureId;
                    const lectureUrl = this.href;

                    fetch(`/student/attend/${lectureId}`, {
                        method: "POST",
                        credentials: "include",
                    })
                        .then(function (response) {
                            if (!response.ok) {
                                return response.json().then(function (data) {
                                    throw new Error(data.detail || "Unable to mark attendance.");
                                });
                            }
                            return response.json();
                        })
                        .then(function (data) {
                            if (data.success) {
                                window.location = lectureUrl;
                            } else {
                                throw new Error("Unable to mark attendance.");
                            }
                        })
                        .catch(function (error) {
                            alert(error.message);
                        });
                });
            });
        });
    </script>
</body>
</html>
